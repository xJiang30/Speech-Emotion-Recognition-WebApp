<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Emotion Recognition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 650px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            padding: 30px;
        }
        .progress { height: 25px; }
        .emoji { font-size: 2.5rem; transition: transform 0.3s ease; }
        .emoji:hover { transform: scale(1.2); }
        #result { display: none; animation: fadeInUp 1s ease-in-out; }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-4">🎧 Speech Emotion Recognition</h3>

        <form id="uploadForm">
            <div class="mb-3">
                <label for="dataset" class="form-label">Select Dataset:</label>
                <select class="form-select" id="dataset" name="dataset">
                    <option value="ravdess">RAVDESS</option>
                    <option value="crema">CREMA-D</option>
                    <option value="savee">SAVEE</option>
                    <option value="tess">TESS</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload or Record Audio:</label>
                <input class="form-control mb-2" type="file" id="file" name="file" accept=".wav">
                <button id="recordBtn" class="btn btn-outline-danger w-100" type="button">🎙 Start Recording</button>
                <p class="text-center text-muted mt-2" id="recordStatus"></p>
            </div>

            <button class="btn btn-primary w-100" type="submit">Upload & Predict 🎭</button>
        </form>

        <hr class="my-4">

        <div id="result">
            <h5 class="text-center mb-3">Prediction Result</h5>
            <p><strong>Dataset:</strong> <span id="res-dataset"></span></p>
            <p><strong>Emotion:</strong>
                <span id="res-emotion"></span>
                <span id="res-emoji" class="emoji"></span>
            </p>
            <label for="confidence" class="form-label">Confidence:</label>
            <div class="progress mb-3">
                <div id="res-confidence" class="progress-bar progress-bar-striped progress-bar-animated"
                     role="progressbar" style="width: 0%">0%</div>
            </div>
            <div class="text-center">
                <audio id="audio-player" controls class="mt-3"></audio>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');
        const datasetSelect = document.getElementById('dataset');
        const audioPlayer = document.getElementById('audio-player');
        const resultDiv = document.getElementById('result');
        const datasetSpan = document.getElementById('res-dataset');
        const emotionSpan = document.getElementById('res-emotion');
        const emojiSpan = document.getElementById('res-emoji');
        const confidenceBar = document.getElementById('res-confidence');
        const emotionEmojis = {
            "happy": "😄", "angry": "😠", "sad": "😢", "fearful": "😨",
            "disgust": "🤢", "neutral": "😐", "surprise": "😲", "calm": "😌"
        };

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    recordStatus.textContent = "Recording... 🔴";
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioURL = URL.createObjectURL(blob);
                        audioPlayer.src = audioURL;
                        recordStatus.textContent = "Recording stopped. Predicting...";
                        await uploadRecordedAudio(blob);
                    };

                    recordBtn.textContent = "⏹ Stop Recording";
                    recordBtn.classList.replace("btn-outline-danger", "btn-danger");
                    isRecording = true;
                } catch (err) {
                    alert("Microphone access denied!");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.textContent = "🎙 Start Recording";
                recordBtn.classList.replace("btn-danger", "btn-outline-danger");
                recordStatus.textContent = "Processing...";
                isRecording = false;
            }
        });

        async function uploadRecordedAudio(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recorded.wav");
            formData.append("dataset", datasetSelect.value);

            const response = await fetch('/predict', { method: 'POST', body: formData });
            if (response.ok) {
                const data = await response.json();
                displayResult(data);
                recordStatus.textContent = "✅ Prediction complete!";
            } else {
                alert("Prediction failed!");
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(form);
            const file = formData.get('file');
            if (file) {
                const audioURL = URL.createObjectURL(file);
                audioPlayer.src = audioURL;
            }
            const response = await fetch('/predict', { method: 'POST', body: formData });
            if (response.ok) {
                const data = await response.json();
                displayResult(data);
            } else {
                alert("Prediction failed!");
            }
        });

        function displayResult(data) {
            datasetSpan.textContent = data.dataset;
            emotionSpan.textContent = data.emotion;
            emojiSpan.textContent = emotionEmojis[data.emotion.toLowerCase()] || "🎭";
            const conf = Math.round(data.confidence * 100);
            confidenceBar.style.width = conf + "%";
            confidenceBar.textContent = conf + "%";
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
